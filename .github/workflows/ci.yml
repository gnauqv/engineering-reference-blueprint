# Tên hiển thị của pipeline trong tab Actions trên GitHub
name: Continuous Integration

# Các sự kiện kích hoạt pipeline
on:
  # Chạy khi có lệnh đẩy code lên nhánh main hoặc develop
  push:
    branches: [ main, develop ]
  # Chạy khi có một Pull Request trỏ vào nhánh main hoặc develop
  pull_request:
    branches: [ main, develop ]

# Định nghĩa các tác vụ tự động cần chạy
jobs:
  code-quality-check:
    # Tên của công việc
    name: Lint and Quality Check
    # Chạy trên môi trường ảo Ubuntu mới nhất do GitHub cung cấp
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Kéo toàn bộ mã nguồn của repo về máy ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Node.js phiên bản 20
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Bước 3: Kiểm tra tính hợp lệ của cấu trúc file (bước kiểm thử mẫu)
      - name: Verify Environment and Files
        run: |
          echo "Bắt đầu kiểm tra tính toàn vẹn của mã nguồn..."
          test -f .editorconfig || exit 1
          echo "Xác nhận file .editorconfig tồn tại thành công."
